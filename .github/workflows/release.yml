name: Release

# Pushing a tag like v0.2.0 builds FontA, packs it with Velopack and publishes a GitHub release.
# Installed copies of FontA check this repository's releases and update themselves, so this workflow is the one place
# where a mistake or a compromise would reach every user. It is deliberately strict:
#   - actions are pinned to exact commits, not movable tags
#   - the token is read-only except in the one job that publishes
#   - the tag name is never pasted into a script (it is passed as an environment variable and validated)
#   - only commits that are on main can be released
#   - dependencies must match the committed lock files exactly
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write   # lets this job create the release and upload its files; nothing else gets write access
    env:
      REPO_URL: https://github.com/${{ github.repository }}
      PACK_ID: FontAApp
      REF_NAME: ${{ github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Only release commits that are on main
        shell: pwsh
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag $env:REF_NAME is not on the main branch, so it will not be released." }

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Work out the version from the tag (v1.2.3 becomes 1.2.3)
        id: version
        shell: pwsh
        run: |
          $v = $env:REF_NAME.TrimStart('v')
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "Tag '$env:REF_NAME' is not like v1.2.3" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Restore exactly the locked dependencies
        run: |
          dotnet restore --locked-mode
          dotnet tool restore

      - name: Test
        run: dotnet test tests/FontA.Tests --configuration Release --no-restore

      - name: Publish the app (self-contained by project setting, so users need no .NET or Windows App SDK install)
        run: >
          dotnet publish src/FontA.App -c Release -p:Platform=x64 --no-restore
          -p:Version=${{ steps.version.outputs.value }} -p:UpdateRepoUrl=${{ env.REPO_URL }}
          -o publish

      # Lets Velopack build small "delta" packages against the previous release. The first release has nothing to download.
      - name: Fetch the previous release
        continue-on-error: true
        run: dotnet vpk download github --repoUrl ${{ env.REPO_URL }} --token $env:GH_TOKEN

      - name: Pack
        # To sign builds, add a certificate and pass --signParams here (see the README).
        run: >
          dotnet vpk pack --packId ${{ env.PACK_ID }} --packVersion ${{ steps.version.outputs.value }}
          --packDir publish --mainExe FontA.App.exe --packTitle FontA --icon assets/fonta.ico

      # This repository uses GitHub's immutable releases: once a release is published, nothing can be added to it or
      # changed. So everything is attached to a DRAFT first, and the release is only published as the very last step.
      - name: Upload the release as a draft
        run: >
          dotnet vpk upload github --repoUrl ${{ env.REPO_URL }} --token $env:GH_TOKEN
          --releaseName "FontA ${{ steps.version.outputs.value }}" --tag $env:REF_NAME

      # Checksums let anyone confirm the installer they downloaded is the one this workflow built.
      - name: Attach SHA-256 checksums to the draft
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          $pattern = 'Setup\.exe$|Portable\.zip$|-' + [regex]::Escape($env:VERSION) + '-(full|delta)\.nupkg$'
          $lines = Get-ChildItem Releases -File |
            Where-Object { $_.Name -match $pattern } |
            Sort-Object Name |
            ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          if (-not $lines) { throw "No release files found to checksum." }
          $lines | Set-Content Releases/SHA256SUMS.txt -Encoding ascii
          $lines
          gh release upload $env:REF_NAME Releases/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw "Could not attach the checksums to the draft release." }

      - name: Publish the release
        shell: pwsh
        run: |
          gh release edit $env:REF_NAME --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the release." }
