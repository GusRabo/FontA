<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="FontA icon">
  <title>FontA</title>
  <defs>
    <clipPath id="disc"><circle cx="512" cy="430" r="340"/></clipPath>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B4DFF"/><stop offset="1" stop-color="#4A1FD1"/>
    </linearGradient>
    <linearGradient id="bottom" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19D3B5"/><stop offset="1" stop-color="#0A9C8E"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="#14122B"/>

  <!-- the logo's disc and F, enlarged to fill the tile (the "Just Doen It" line is left out: it can't be read at icon sizes) -->
  <g transform="translate(512 512) scale(1.2) translate(-512 -430)">
    <g clip-path="url(#disc)">
      <rect x="0" y="0" width="1024" height="1024" fill="url(#bottom)"/>
      <path d="M0 0 H1024 V430 C 900 520, 760 530, 640 430 C 520 330, 350 340, 270 430 C 190 520, 90 520, 0 430 Z" fill="url(#top)"/>
      <path d="M0 430 C 90 520, 190 520, 270 430 S 520 330, 640 430 S 900 520, 1024 430"
            fill="none" stroke="#FFFFFF" stroke-width="58" stroke-linecap="round"/>
    </g>
    <circle cx="512" cy="430" r="340" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="10"/>
    <g transform="translate(512 430) skewX(-8) translate(-512 -430)">
      <g fill="#14122B" stroke="#FFFFFF" stroke-width="14" stroke-linejoin="round">
        <rect x="352" y="232" width="104" height="402" rx="26"/>
        <rect x="352" y="232" width="318" height="96" rx="26"/>
        <rect x="352" y="394" width="244" height="88" rx="26"/>
      </g>
      <g fill="#14122B">
        <rect x="352" y="232" width="104" height="402" rx="26"/>
        <rect x="352" y="232" width="318" height="96" rx="26"/>
        <rect x="352" y="394" width="244" height="88" rx="26"/>
      </g>
    </g>
  </g>
</svg>
